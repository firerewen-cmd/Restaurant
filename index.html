<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Digitale - Ristorante</title>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        
        .client-header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 1.5rem 1rem; text-align: center; position: sticky; top: 0; z-index: 10; }
        .restaurant-title { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin: 0; }
        .table-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; background: var(--primary); color: white; padding: 3px 8px; margin-top: 0.5rem; text-transform: uppercase; }

        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }

        /* Filtro Categorie Scrollabile */
        .category-nav { display: flex; gap: 0.5rem; overflow-x: auto; padding: 0.5rem 0 1rem 0; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-tab { padding: 0.5rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); font-weight: 700; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
        .cat-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Listing Piatti */
        .dish-section { margin-bottom: 2rem; }
        .category-heading { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 0.5rem; margin-bottom: 1rem; }
        
        .client-dish-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); position: relative; }
        .client-dish-card.disabled { opacity: 0.5; filter: grayscale(100%); pointer-events: none; }
        .client-dish-card.disabled::after { content: "NON DISPONIBILE"; position: absolute; top: 10px; right: 10px; background: var(--danger); color: white; font-size: 0.65rem; font-weight: 800; padding: 2px 6px; }

        .dish-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
        .dish-name { font-weight: 700; font-size: 1.05rem; }
        .dish-price { font-weight: 800; color: var(--primary); font-size: 1.05rem; }
        .dish-description { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; line-height: 1.3; }

        /* Allergeni */
        .allergens-row { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .client-allergen-badge { font-size: 0.65rem; font-weight: 700; background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 1px 5px; }

        /* Box Recensione */
        .review-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; margin-top: 3rem; box-shadow: var(--shadow); }
        .review-box h3 { font-size: 1rem; font-weight: 800; margin-top: 0; margin-bottom: 0.5rem; text-transform: uppercase; }
        .star-rating { display: flex; gap: 0.5rem; font-size: 1.8rem; cursor: pointer; color: var(--border-color); margin-bottom: 1rem; }
        .star-rating .star.active { color: #f59e0b; }
    </style>
</head>
<body>

    <header class="client-header">
        <h1 class="restaurant-title">MENU RISTORANTE</h1>
        <div class="table-badge" id="tableDisplay">TAVOLO N/D</div>
    </header>

    <main class="container">
        <!-- BARRA SELEZIONE CATEGORIE -->
        <nav class="category-nav" id="clientCategoryTabs">
            <button class="cat-tab active" onclick="filterClientCategory('all')">TUTTI</button>
        </nav>

        <!-- LISTA PIATTI DIVISA PER CATEGORIE -->
        <div id="clientMenuContainer">
            <!-- Caricamento dinamico dei piatti -->
        </div>

        <!-- FORM RECENSIONE CLIENTE -->
        <div class="review-box">
            <h3>Lascia una Recensione</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">Valuta la tua esperienza al tavolo in tempo reale.</p>

            <form id="clientReviewForm">
                <div class="star-rating" id="starRatingContainer">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <input type="hidden" id="selectedRating" value="5">

                <div style="margin-bottom: 1rem;">
                    <textarea id="reviewComment" rows="3" placeholder="Scrivi un breve commento (opzionale)..." style="width: 100%; box-sizing: border-box;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">INVIA FEEDBACK</button>
            </form>
        </div>
    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/cliente-main.js"></script>
</body>
</html>
