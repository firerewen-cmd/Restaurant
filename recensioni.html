<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recensioni Live - Gestione Ristorante</title>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--bg-sidebar); color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--border-color); }
        .sidebar-brand { padding: 1.5rem; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.1); color: var(--primary); }
        .sidebar-menu { list-style: none; padding: 1rem 0; }
        .sidebar-menu li a { display: block; padding: 0.85rem 1.5rem; color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 500; border-left: 3px solid transparent; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { color: #ffffff; background-color: rgba(255, 255, 255, 0.05); border-left-color: var(--primary); }
        .main-wrapper { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-main); }
        .topbar { height: 64px; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; }
        .content-area { padding: 2rem; flex: 1; }

        /* Griglia Recensioni e Stats */
        .reviews-layout { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; }
        @media (max-width: 900px) { .reviews-layout { grid-template-columns: 1fr; } }

        .reviews-list { display: flex; flex-direction: column; gap: 1rem; }
        .review-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; box-shadow: var(--shadow); position: relative; }
        .review-card.new-arrival { animation: highlight 2s ease-out; }
        
        @keyframes highlight {
            0% { border-color: var(--primary); background-color: var(--primary-light); }
            100% { border-color: var(--border-color); background-color: var(--bg-card); }
        }

        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .review-stars { color: #f59e0b; font-weight: 800; letter-spacing: 2px; }
        .review-date { font-size: 0.75rem; color: var(--text-muted); }
        .review-comment { font-size: 0.9rem; margin-top: 0.5rem; color: var(--text-main); line-height: 1.4; }
        .review-table-tag { font-size: 0.7rem; font-weight: 700; background: var(--bg-main); border: 1px solid var(--border-color); padding: 2px 6px; }

        .stats-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; box-shadow: var(--shadow); height: fit-content; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">PANNELLO RISTORANTE</div>
                <ul class="sidebar-menu">
                    <li><a href="dashboard.html">📊 PANORAMICA</a></li>
                    <li><a href="menu.html">🍕 MENU DETTAGLIATO</a></li>
                    <li><a href="recensioni.html" class="active">⭐ RECENSIONI & GRAFICI</a></li>
                    <li><a href="ingredienti.html">📦 INGREDIENTI / ESAURITI</a></li>
                </ul>
            </div>
            <div style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <button onclick="logoutUser()" class="btn btn-outline" style="width: 100%; color: #ef4444; border-color: #ef4444;">LOGOUT</button>
            </div>
        </aside>

        <!-- MAIN WRAPPER -->
        <div class="main-wrapper">
            <header class="topbar">
                <div style="font-weight: 600;">Feedback & Recensioni Live</div>
                <button id="themeToggleBtn" class="btn btn-outline">🌙 Tema Scuro</button>
            </header>

            <main class="content-area">
                <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                    <h2>Recensioni dei Clienti</h2>
                    <span id="liveStatus" style="font-size: 0.8rem; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 4px 8px; border: 1px solid var(--primary);">● REALTIME ATTIVO</span>
                </div>

                <div class="reviews-layout">
                    <!-- LISTA FEEDBACK IN TEMPO REALE -->
                    <div class="reviews-list" id="reviewsContainer">
                        <!-- Caricate da Supabase -->
                    </div>

                    <!-- BOX STATISTICHE -->
                    <div class="stats-box">
                        <h3 style="font-size: 0.95rem; margin-bottom: 1rem;">Distribuzione Voti</h3>
                        <canvas id="ratingsChart" height="200"></canvas>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/recensioni-main.js"></script>
</body>
</html>
