<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Area Ristoratore</title>
    
    <!-- Foglio di Stile Unificato -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
            box-shadow: var(--shadow);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .login-btn {
            width: 100%;
            margin-top: 0.5rem;
        }
        .error-msg {
            color: var(--danger);
            background-color: rgba(220, 38, 38, 0.08);
            border: 1px solid var(--danger);
            padding: 0.6rem;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>AREA RISTORATORE</h2>
            <p>Accedi al pannello di controllo</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="admin@ristorante.it" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary login-btn">ACCEDI</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <!-- Script Supabase e Logica Login -->
    <script src="js/supabase-config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            errorMsg.style.display = 'none';

            // Usiamo il client window.db configurato in supabase-config.js
            const { data, error } = await window.db.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = 'Errore di accesso: ' + error.message;
                errorMsg.style.display = 'block';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
